<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Elo — sua comunidade</title><link rel="stylesheet" href="/style.css"><script type="module" src="/setup.js"></script></head>
<body class="desktop-setup"><main class="setup-card"><img src="/favicon.svg" alt="Elo" width="56" height="56"><div class="eyebrow">SUA GALERA, NO MESMO LUGAR</div><h1>Conecte sua<br><span>comunidade.</span></h1><p>Cole o endereço do Elo que o organizador compartilhou. Todos precisam usar a mesma comunidade para se encontrar.</p><form id="setup-form"><label class="field-label" for="server-url">Endereço da comunidade</label><input id="server-url" type="url" placeholder="https://sua-comunidade.onrender.com" required><button class="primary full" type="submit">Entrar no Elo</button><p id="setup-error" role="alert"></p></form><p>O aplicativo já inclui o microfone e a conexão com o LoL. Basta manter o Elo aberto enquanto conversa.</p></main></body></html>
